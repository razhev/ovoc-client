name: CI

# Проверки, которым не нужны телефон, подпись и фреймворк: тесты на Mac и каталог строк.
# Сборка OpenVPNAdapter из исходников (make framework) сюда не входит — она долгая и
# скачивает исходники и Go-тулчейн.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Mac tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          python3 --version

      - name: Unit tests (ConfigKit, tunnel runtime, framework provenance)
        run: make test

      - name: Localization catalog
        run: make strings-check
