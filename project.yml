# Описание Xcode-проекта для XcodeGen — единый источник правды.
# OVoCClient.xcodeproj генерируется командой `make gen` и НЕ хранится в git.
# Имя проекта и таргета — без пробела (модуль Swift, пути в скриптах);
# видимое имя «OVoC Client» — в CFBundleDisplayName ниже.
name: OVoCClient

options:
  bundleIdPrefix: com.razhev
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  # Язык разработки (developmentRegion проекта и CFBundleDevelopmentRegion):
  # русский — базовый, ключи в App/Localizable.xcstrings — русские строки,
  # английский — перевод в том же каталоге. knownRegions XcodeGen выводит
  # из каталога сам (ru + en).
  developmentLanguage: ru

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Device-only: у OpenVPNAdapter.framework нет simulator-slice,
    # а Network Extension в симуляторе не работает в принципе.
    SUPPORTED_PLATFORMS: iphoneos
    # TARGETED_DEVICE_FAMILY задаётся на таргетах: пресет XcodeGen (Platforms/iOS.yml)
    # ставит "1,2" на уровне таргета и перебивает значение отсюда.
    CODE_SIGN_STYLE: Automatic
    # Team ID платной команды (developer.apple.com → Membership). Не секрет:
    # он и так зашит в каждую подписанную сборку.
    DEVELOPMENT_TEAM: "222A4867MA"
    CURRENT_PROJECT_VERSION: "3"
    MARKETING_VERSION: "0.1.0"

packages:
  ConfigKit:
    path: ConfigKit

targets:
  OVoCClient:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      # Расширение встраивается в приложение (Embed App Extensions).
      - target: PacketTunnel
      # Разбор ключа vpn:// — только в приложении; расширение не парсит ничего.
      - package: ConfigKit
      # Фреймворк живёт в бандле ПРИЛОЖЕНИЯ (appex не может embed'ить фреймворки),
      # расширение находит его через runpath ../../Frameworks.
      # link: false — приложение его не импортирует; без линковки Go-runtime
      # не стартует в процессе приложения, а сбой загрузки фреймворка не
      # убивает приложение раньше, чем оно покажет диагностику.
      - framework: Frameworks/OpenVPNAdapter.framework
        embed: true
        codeSign: true
        link: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.razhev.ovocclient
        CODE_SIGN_ENTITLEMENTS: App/OVoCClient.entitlements
        # Только iPhone (пресет XcodeGen иначе ставит "1,2").
        TARGETED_DEVICE_FAMILY: "1"
        # Пресет application_iOS.yml ставит устаревшее "iPhone Developer".
        CODE_SIGN_IDENTITY: "Apple Development"
    info:
      path: App/Info.plist
      properties:
        # Видимое имя (домашний экран, системный диалог VPN). Код берёт его
        # отсюда же — Bundle.main.displayName в App/OVoCClientApp.swift.
        CFBundleDisplayName: OVoC Client
        # Версии — из build settings (MARKETING_VERSION / CURRENT_PROJECT_VERSION),
        # иначе XcodeGen зашивает 1.0 / 1 и настройки выше не действуют.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Экран запуска — цвета «Печки», без белой вспышки перед сценой.
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Шрифты «Печки» (App/Fonts, Google Fonts, лицензия OFL — рядом).
        UIAppFonts:
          - Marmelad-Regular.ttf
          - Rubik-Regular.ttf
          - Rubik-Medium.ttf
          - Rubik-SemiBold.ttf
          - PTMono-Regular.ttf
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        # Экспорт шифрования. У нас свои реализации стандартных алгоритмов (OpenVPN3/mbed TLS,
        # Go-крипто Cloak), а не только системные. По таблице Apple («Export compliance
        # documentation for encryption») для стандартных алгоритмов нужна только французская
        # декларация — и только при раздаче в App Store во Франции. TestFlight — не App Store,
        # значит документы не нужны, и Apple велит отметить это здесь (NO = «освобождено от
        # документов»); без флага каждая загрузка задаёт вопрос про шифрование. Проверено 2026-09-27.
        ITSAppUsesNonExemptEncryption: false
        # Ссылки для экрана «О приложении» и карточки о данных на экране импорта.
        # Пустая строка — ссылка не показывается (вместо исходников — «по запросу у
        # разработчика»). Заполнить, когда исходники и политика опубликованы:
        # docs/TESTFLIGHT.md, «Первая загрузка», шаги 7–8.
        OVoCSourceCodeURL: ""
        OVoCPrivacyPolicyURL: "https://gist.github.com/razhev/f7d26b50c314d2fb5f441bd496113c8b"
    scheme:
      testTargets: []

  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - PacketTunnel
      - Shared
    dependencies:
      - framework: Frameworks/OpenVPNAdapter.framework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.razhev.ovocclient.tunnel
        CODE_SIGN_ENTITLEMENTS: PacketTunnel/PacketTunnel.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
    info:
      path: PacketTunnel/Info.plist
      properties:
        CFBundleDisplayName: PacketTunnel
        # Версии appex обязаны совпадать с версиями приложения.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
